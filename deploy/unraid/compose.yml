name: aios

networks:
  br0_network:
    external: true
    name: br0

services:
  mysql:
    image: mysql:8.0
    container_name: aios_mysql
    restart: unless-stopped
    networks:
      br0_network:
        ipv4_address: ${MYSQL_IP:-192.168.1.130}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - /mnt/user/docker/aios/mysql:/var/lib/mysql
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aios}
      MYSQL_USER: ${MYSQL_USER:-congke}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aios_redis
    restart: unless-stopped
    networks:
      br0_network:
        ipv4_address: ${REDIS_IP:-192.168.1.131}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - /mnt/user/docker/aios/redis:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: aios_minio
    restart: unless-stopped
    networks:
      br0_network:
        ipv4_address: ${MINIO_IP:-192.168.1.135}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - /mnt/user/docker/aios/minio/data:/data
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://192.168.1.135:9001}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://192.168.1.135:9000}
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: aios_minio_init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      br0_network:
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set aios http://${MINIO_IP:-192.168.1.135}:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing aios/${MINIO_BUCKET:-aios-assets}
      && mc anonymous set download aios/${MINIO_BUCKET:-aios-assets}
      && echo '[aios] minio bucket initialized'"

  api:
    image: ${AIOS_API_IMAGE:-ghcr.io/congke1940/aios-api}:${AIOS_VERSION:-latest}
    container_name: aios_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      br0_network:
        ipv4_address: ${AIOS_API_IP:-192.168.1.132}
    ports:
      - "${AIOS_API_PORT:-18081}:18081"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      AIOS_APP_NAME: aios-practice-platform
      AIOS_APP_ENV: ${AIOS_APP_ENV:-prod}
      AIOS_HTTP_ADDR: :18081
      AIOS_MYSQL_DSN: ${MYSQL_USER:-congke}:${MYSQL_PASSWORD}@tcp(${MYSQL_IP:-192.168.1.130}:3306)/${MYSQL_DATABASE:-aios}?parseTime=true&loc=Local
      AIOS_REDIS_ADDR: ${REDIS_IP:-192.168.1.131}:6379
      AIOS_REDIS_PASSWORD: ${REDIS_PASSWORD}
      AIOS_JWT_SECRET: ${AIOS_JWT_SECRET}
      AIOS_FILE_STORAGE_DIR: /data/file_assets
      AIOS_PLATFORM_TENANT_ID: ${AIOS_PLATFORM_TENANT_ID:-1}
      AIOS_OBJECT_STORAGE_DRIVER: minio
      AIOS_S3_ENDPOINT: http://${MINIO_IP:-192.168.1.135}:9000
      AIOS_S3_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://192.168.1.135:9000}
      AIOS_S3_BUCKET: ${MINIO_BUCKET:-aios-assets}
      AIOS_S3_REGION: ${MINIO_REGION:-us-east-1}
      AIOS_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AIOS_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AIOS_S3_FORCE_PATH_STYLE: "true"
    volumes:
      - /mnt/user/docker/aios/file_assets:/data/file_assets
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:18081/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  admin-web:
    image: ${AIOS_ADMIN_WEB_IMAGE:-ghcr.io/congke1940/aios-admin-web}:${AIOS_VERSION:-latest}
    container_name: aios_admin_web
    restart: unless-stopped
    networks:
      br0_network:
        ipv4_address: ${AIOS_ADMIN_WEB_IP:-192.168.1.133}
    ports:
      - "${AIOS_ADMIN_WEB_PORT:-18082}:80"
    depends_on:
      api:
        condition: service_healthy

  user-web:
    image: ${AIOS_USER_WEB_IMAGE:-ghcr.io/congke1940/aios-user-web}:${AIOS_VERSION:-latest}
    container_name: aios_user_web
    restart: unless-stopped
    networks:
      br0_network:
        ipv4_address: ${AIOS_USER_WEB_IP:-192.168.1.134}
    ports:
      - "${AIOS_USER_WEB_PORT:-18083}:80"
    depends_on:
      api:
        condition: service_healthy
