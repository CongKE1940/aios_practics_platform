  /analytics/exam-overview:
    get:
      tags: [Analytics]
      summary: 考试概览
      operationId: getExamOverview
      parameters:
        - in: query
          name: exam_id
          required: true
          schema:
            type: integer
            format: int64
          description: 考试 ID。
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: page_size
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: attempt_status
          required: false
          schema:
            type: string
            enum: [not_started, in_progress, submitted]
          description: 作答状态筛选；不传表示全部，submitted 包含超时交卷。
        - in: query
          name: review_status
          required: false
          schema:
            type: string
            enum: [pending, reviewed]
          description: 批阅状态筛选；pending 表示仍有待人工批阅主观题，reviewed 表示无需批阅或已完成批阅。
        - in: query
          name: keyword
          required: false
          schema:
            type: string
          description: 按学生姓名或学号模糊搜索。
      responses:
        '200': { $ref: '#/components/responses/ExamOverviewOk' }
