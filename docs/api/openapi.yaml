      responses:
        '200': { $ref: '#/components/responses/Ok' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Ok:
      description: OK
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BaseResponse'
  requestBodies:
    RoleBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RoleInput'
    RolePermissionsBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RolePermissionsInput'
    UserBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserInput'
    UserRolesBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UserRolesInput'
    ResetPasswordBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResetPasswordInput'
    NoticeBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoticeInput'
    SchoolBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SchoolInput'
    GradeBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GradeInput'
    ClassBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClassInput'
    CourseBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CourseInput'
  schemas:
    BaseResponse:
      type: object
      properties:
        code:
          type: integer
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
        request_id:
          type: string
    SchoolInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
    GradeInput:
      type: object
      required: [school_id, code, name, grade_level]
      properties:
        school_id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        grade_level:
          type: integer
        school_year:
          type: string
          nullable: true
    ClassInput:
      type: object
      required: [school_id, grade_id, code, name]
      properties:
        school_id:
          type: integer
          format: int64
        grade_id:
          type: integer
          format: int64
        code:
          type: string
        name:
          type: string
        class_no:
          type: integer
          nullable: true
    NoticeInput:
      type: object
      required: [title, content, notice_type, publish_scope_type, publish_scope, publish_at]
      properties:
        title:
          type: string
        content:
          type: string
        notice_type:
          type: string
        publish_scope_type:
          type: string
        publish_scope:
          type: object
          additionalProperties: true
        publish_at:
          type: string
          format: date-time
        expire_at:
          type: string
          format: date-time
          nullable: true
    RoleInput:
      type: object
      required: [code, name, role_type, data_scope_type]
      properties:
        code:
          type: string
        name:
          type: string
        role_type:
          type: string
        data_scope_type:
          type: string
        remark:
          type: string
          nullable: true
    RolePermissionsInput:
      type: object
      required: [permission_ids]
      properties:
        permission_ids:
          type: array
          items:
            type: integer
            format: int64
    UserInput:
      type: object
      required: [username, display_name, user_type]
      properties:
        username:
          type: string
        display_name:
          type: string
        user_type:
          type: string
        phone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
        role_ids:
          type: array
          items:
            type: integer
            format: int64
    UserRolesInput:
      type: object
      required: [role_ids]
      properties:
        role_ids:
          type: array
          items:
            type: integer
            format: int64
    ResetPasswordInput:
      type: object
      required: [new_password]
      properties:
        new_password:
          type: string
    CourseInput:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
        description:
          type: string
          nullable: true
